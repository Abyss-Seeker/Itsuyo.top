<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色关系图 · 4×4 Anime Character Grid</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cell-size:190px;--edge-size:42px;--min-edge-font:6px;
  --border-color:#1a1a1a;--bg:#f5f0eb;--accent:#e85d75;--accent2:#7c5cbf;
  --text:#2c2c2c;--text-light:#666;--card-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08);
}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:20px;-webkit-font-smoothing:antialiased;
}
header{text-align:center;margin-bottom:8px}
header h1{font-size:26px;font-weight:700;letter-spacing:.5px;color:#1a1a1a}
header .subtitle{font-size:13px;color:var(--text-light);margin-bottom:6px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-bottom:16px;background:var(--card-bg);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow)}
.toolbar label{font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--text);white-space:nowrap}
.toolbar input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.toolbar .mode-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;border:1.5px solid #ddd;cursor:pointer;transition:all .2s;user-select:none}
.toolbar .mode-badge.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.toolbar .mode-badge:hover:not(.active){border-color:var(--accent2);color:var(--accent2)}
.api-settings{position:relative;font-size:12px}.api-settings summary{cursor:pointer;color:var(--text-light);user-select:none}.api-settings[open] .api-popover{display:flex}.api-popover{position:absolute;z-index:30;top:28px;right:0;width:300px;padding:12px;background:#fff;border:1px solid #e6e0e4;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:none;flex-direction:column;gap:7px}.api-popover input,.api-popover select{width:100%;padding:7px 9px;border:1.5px solid #ddd;border-radius:7px;outline:none;background:#fff}.api-popover small{color:#777;line-height:1.45}.api-endpoint-status{font-size:11px;color:#6f5aa5;min-height:16px}
.btn{padding:7px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#d44a63;transform:translateY(-1px);box-shadow:0 3px 8px rgba(232,93,117,.3)}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid #ddd}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* Grid */
.grid-wrapper{position:relative;background:var(--card-bg);padding:28px;border-radius:16px;box-shadow:var(--shadow);display:inline-block;overflow:visible}
.grid-container{display:grid;gap:0;grid-template-columns:var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size);grid-template-rows:var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size)}
.grid-container.compact{position:relative;grid-template-columns:repeat(4,var(--cell-size));grid-template-rows:repeat(4,var(--cell-size))}
.grid-container.compact .cell-wrapper{border:1.5px solid var(--border-color);background:#fafafa}
.grid-container.compact .cell-border{border:none}
.grid-container.compact .cell-border:hover{box-shadow:none}
.grid-container.compact .cell-index{display:none}

/* Cells */
.cell-wrapper{position:relative}
.cell-border{width:100%;height:100%;border:2.5px solid var(--border-color);border-radius:2px;overflow:hidden;position:relative;cursor:pointer;background:#fafafa;transition:box-shadow .2s}
.cell-border:hover{box-shadow:0 0 0 3px rgba(232,93,117,.15)}
.cell-border.empty-cell::after{content:'+';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;color:#ccc;font-weight:300;pointer-events:none}
.cell-border.dragging{cursor:grabbing!important}
.cell-border.has-image{cursor:grab}
.cell-border img{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cell-info-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;padding:16px 8px 6px;font-size:11px;line-height:1.3;pointer-events:none;display:none}
.cell-info-overlay.visible{display:block}
.cell-info-overlay .char-name{font-weight:700;font-size:12px}
.cell-info-overlay .char-parody{font-size:10px;opacity:.85;margin-top:1px}
.cell-edit-btn,.cell-clear-btn,.cell-swap-btn{position:absolute;right:6px;background:rgba(255,255,255,.92);border:1px solid #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;opacity:0;transition:opacity .2s,transform .2s}
.cell-edit-btn,.cell-clear-btn,.cell-swap-btn{width:24px;height:24px;border-radius:50%}
.cell-edit-btn{top:6px;font-size:14px;color:#555}
.cell-clear-btn{top:34px;font-size:12px;color:#c0392b}
.cell-swap-btn{top:62px;font-size:14px;color:var(--accent2)}
.cell-border:hover .cell-edit-btn,.cell-border.has-image .cell-edit-btn,.cell-border:hover .cell-clear-btn,.cell-border.has-image .cell-clear-btn,.cell-border:hover .cell-swap-btn,.cell-border.has-image .cell-swap-btn{opacity:1}
.cell-edit-btn:hover{background:#fff;border-color:var(--accent)}
.cell-swap-btn:hover,.cell-swap-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2);transform:scale(1.06)}
.cell-border.swap-source{box-shadow:inset 0 0 0 5px rgba(124,92,191,.9),0 0 0 4px rgba(124,92,191,.25);animation:swapPulse 1.1s ease-in-out infinite alternate}
@keyframes swapPulse{to{box-shadow:inset 0 0 0 5px rgba(232,93,117,.95),0 0 0 7px rgba(232,93,117,.2)}}
.cell-index{position:absolute;top:6px;left:8px;font-size:10px;color:#bbb;pointer-events:none}
.swap-banner{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:1500;background:#342958;color:#fff;padding:10px 14px 10px 18px;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;animation:swapBannerIn .2s}.swap-banner[hidden]{display:none}.swap-banner button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:14px;padding:3px 9px;cursor:pointer}@keyframes swapBannerIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Normal edge strips */
.edge-strip{position:relative;display:flex;align-items:center;justify-content:center;cursor:text;transition:background .15s}
.edge-strip:hover{background:rgba(124,92,191,.06)}
.edge-strip.editing{background:rgba(124,92,191,.1);outline:1.5px dashed var(--accent2);outline-offset:-2px}
.edge-h{flex-direction:column}
.edge-h .edge-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#444;line-height:1.08;text-align:center}
.edge-v{flex-direction:row}
.edge-v .edge-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#444;line-height:1.03;padding:0 4px;text-align:center;word-break:break-all}
.edge-placeholder{color:#ccc;font-size:11px;pointer-events:none}
.edge-text-input{position:absolute;top:0;left:0;width:100%;height:100%;border:none;outline:none;resize:none;background:transparent;font-family:inherit;opacity:0;padding:4px;font-size:13px;z-index:5}
.edge-v .edge-text-input{text-align:center}
.edge-h .edge-text-input{writing-mode:vertical-rl;text-orientation:mixed;text-align:start}
.edge-strip.empty-edge .edge-text{color:#ccc;font-style:italic}
.edge-intersection{background:transparent;pointer-events:none}

/* ═══ Compact edge labels (redesigned: no bubble, bold + shadow) ═══ */
.edge-labels-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8}
.edge-label{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;overflow:visible;background:transparent;border:none;transition:opacity .15s}
.edge-label:hover{opacity:.85}
.edge-label.editing{opacity:1}
.edge-label .el-text{font-weight:900;color:#fff;text-align:center;line-height:1.03;width:100%;height:100%;display:flex;align-items:center;justify-content:center;word-break:break-all;
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
               -1px 0 0 #000, 1px 0 0 #000, 0 -1px 0 #000, 0 1px 0 #000,
               0 0 4px #000;
}
.edge-label.h-label .el-text{writing-mode:horizontal-tb;display:flex;align-items:center;justify-content:center;height:100%}
.edge-lines{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
.edge-lines.horizontal{flex-direction:column}
.edge-lines.vertical{flex-direction:row-reverse}
.edge-lines .edge-line{display:block;white-space:nowrap;line-height:1.03;text-align:center}
.edge-lines.vertical .edge-line{writing-mode:vertical-rl;text-orientation:mixed;max-height:100%}
.edge-label .el-placeholder{font-weight:400;opacity:.4;font-size:9px;text-shadow:none;color:#fff}
.edge-label .el-input{position:absolute;inset:-4px;border:none;outline:none;resize:none;background:rgba(0,0,0,.7);color:#fff;font-family:inherit;text-align:center;opacity:0;padding:4px;font-size:11px;z-index:2;border-radius:4px;font-weight:700}
.edge-label.h-label .el-input{writing-mode:vertical-rl;text-orientation:mixed}
.edge-label .el-input::placeholder{color:rgba(255,255,255,.4)}
.edge-resize-handle{position:absolute;right:1px;bottom:1px;width:9px;height:9px;border-radius:50%;background:var(--accent2);border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:ns-resize;z-index:12;opacity:.7;touch-action:none}
.edge-resize-handle:hover{opacity:1;transform:scale(1.18)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-panel{background:#fff;border-radius:16px;width:550px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.modal-header h3{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:all .2s}
.modal-close:hover{background:#e0e0e0;color:#333}
.modal-tabs{display:flex;padding:10px 20px;border-bottom:1.5px solid #eee;position:sticky;top:50px;background:#fff;z-index:2;gap:4px}
.modal-tabs .tab-btn{flex:1;padding:8px 4px;border:none;background:transparent;font-size:12px;font-weight:600;color:#999;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.modal-tabs .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.modal-body{padding:16px 20px 20px}
.search-input-wrap{position:relative;margin-bottom:10px}
.search-input-wrap input{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-hint{font-size:11px;color:#aaa;margin-bottom:8px;line-height:1.4}
.search-loading{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:2px solid #eee;border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:none}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.search-results{max-height:380px;overflow-y:auto}
.search-progress{position:sticky;top:0;z-index:2;padding:6px 9px;margin-bottom:5px;border-radius:8px;background:rgba(124,92,191,.1);color:#6f5aa5;font-size:11px;line-height:1.35;backdrop-filter:blur(6px)}
.result-card{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;transition:background .15s;border:1.5px solid transparent;margin-bottom:4px}
.result-card:hover{background:#fef0f3;border-color:#fdd}
.result-thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#f0f0f0;flex-shrink:0;overflow:hidden}
.result-thumb img{width:100%;height:100%;object-fit:cover}
.result-info{min-width:0}
.result-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-sub{font-size:11px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-section-title{padding:8px 0 6px;font-size:12px;font-weight:700;color:var(--accent2);border-top:1px solid #f0f0f0;margin-top:8px}
.result-section-title:first-child{border-top:none;margin-top:0}
.no-results{text-align:center;color:#aaa;padding:30px 0;font-size:13px;line-height:1.6}
.tag-429{display:inline-block;background:#fff3cd;color:#856404;font-size:11px;padding:2px 8px;border-radius:4px;margin-top:6px}

/* Upload */
.upload-area{border:2px dashed #ddd;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px;position:relative}
.upload-area:hover,.upload-area.drag-over{border-color:var(--accent);background:#fef5f7}
.upload-area p{color:#999;font-size:13px}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-preview{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.upload-preview img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #eee}
.upload-form{display:flex;flex-direction:column;gap:8px}
.upload-form input{padding:8px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.upload-form input:focus{border-color:var(--accent2)}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);max-width:min(90vw,560px);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;line-height:1.4;text-align:center;z-index:2000;pointer-events:none;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.fadeout{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0}}
.export-fallback{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2100;width:min(92vw,560px);padding:14px 16px;background:rgba(38,31,55,.97);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.32);font-size:13px;line-height:1.5;text-align:left}.export-fallback strong{display:block;font-size:15px;margin-bottom:4px}.export-fallback-detail{color:rgba(255,255,255,.72);font-size:11px;margin-top:5px;word-break:break-word}.export-fallback-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:11px}.export-fallback button{border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px;color:#fff;background:transparent;cursor:pointer;font-weight:700}.export-fallback .fallback-start{background:var(--accent);border-color:var(--accent)}.export-fallback button:disabled{opacity:.45;cursor:not-allowed}
body.desperate-capture{overflow:hidden!important;background:#fff!important}body.desperate-capture .cell-edit-btn,body.desperate-capture .cell-clear-btn,body.desperate-capture .cell-swap-btn,body.desperate-capture .cell-index,body.desperate-capture .edge-resize-handle,body.desperate-capture .edge-text-input,body.desperate-capture .edge-label .el-input{display:none!important}body.desperate-capture .cell-border.swap-source,body.desperate-capture .cell-border.mobile-crop-active{animation:none!important;box-shadow:none!important}

@media(max-width:960px){:root{--cell-size:clamp(100px,20vw,160px);--edge-size:clamp(24px,5vw,32px);--min-edge-font:5px}.toolbar{gap:6px;padding:8px 12px}.btn{padding:6px 10px;font-size:12px}.modal-tabs .tab-btn{font-size:11px}}
@media(max-width:680px){:root{--cell-size:clamp(78px,22vw,100px);--edge-size:clamp(18px,4vw,24px);--min-edge-font:5px}.grid-wrapper{padding:8px}.cell-border{border-width:2px}.modal-panel{max-width:98vw}.cell-edit-btn,.cell-clear-btn,.cell-swap-btn{width:24px;height:24px;right:3px}.cell-edit-btn{top:3px;font-size:13px}.cell-clear-btn{top:29px;font-size:12px}.cell-swap-btn{top:55px;font-size:13px}.toolbar label{font-size:11px}}

/* Mobile in-place image crop controls */
.mobile-crop-controls{display:none}
@media(max-width:768px){
  body.mobile-crop-open{padding-bottom:calc(86px + env(safe-area-inset-bottom))}body.mobile-crop-open .toast{bottom:calc(82px + env(safe-area-inset-bottom))}
  .cell-border.mobile-crop-active{touch-action:none;box-shadow:inset 0 0 0 4px rgba(124,92,191,.95),0 0 0 3px rgba(124,92,191,.28);z-index:14}
  .mobile-crop-controls{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:1900;display:grid;grid-template-columns:auto minmax(100px,1fr) auto auto;align-items:center;gap:9px;padding:11px 12px;background:rgba(38,31,55,.96);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.32);backdrop-filter:blur(12px)}
  .mobile-crop-controls[hidden]{display:none}
  .mobile-crop-meta{display:flex;flex-direction:column;min-width:54px;line-height:1.15}.mobile-crop-meta strong{font-size:12px}.mobile-crop-meta span{font-size:10px;color:rgba(255,255,255,.68);margin-top:3px}
  .mobile-crop-controls input[type=range]{width:100%;min-width:0;accent-color:var(--accent);touch-action:pan-x}
  .mobile-crop-controls button{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:700;white-space:nowrap;touch-action:manipulation}
  .mobile-crop-controls .mobile-crop-done{background:var(--accent);border-color:var(--accent)}
}
</style>
</head>
<body>

<header><h1>角色关系图 4×4</h1><p class="subtitle">点空格子添加角色 · 格内拖拽+滚轮调图 · 点边写关系 · Ctrl+E 导出</p></header>

<div class="toolbar">
  <span class="mode-badge" id="modeNormal">展开</span>
  <span class="mode-badge active" id="modeCompact">紧凑</span>
  <label><input type="checkbox" id="toggleInfo"> 信息</label>
  <details class="api-settings"><summary>API 设置</summary><div class="api-popover"><select id="bgmEndpointMode" aria-label="Bangumi 接口线路"><option value="auto">自动：大陆镜像优先</option><option value="anibt">镜像 A：anibt.net</option><option value="lol">镜像 B：bangumi.lol</option><option value="official">Bangumi 官方</option><option value="custom">自定义 API</option></select><input id="bgmCustomEndpoint" type="url" inputmode="url" autocomplete="off" placeholder="自定义 API 根地址（可选）"><input id="token" type="password" autocomplete="off" placeholder="官方 Bangumi Token（通常不需要）"><div class="api-endpoint-status" id="bgmEndpointStatus">等待首次 Bangumi 请求</div><small>自动模式依次尝试两个大陆镜像和官方接口，失败会自动换线；填写自定义地址后会优先尝试。搜索会同时使用 Bangumi 与 AniList；Token 只会发送到官方域名，绝不会发送给第三方镜像。</small></div></details>
  <button class="btn btn-primary" id="exportBtn">导出 PNG</button>
  <button class="btn btn-outline" id="clearAllBtn">清空</button>
</div>

<div class="grid-wrapper" id="gridWrapper">
  <div style="position:relative;display:inline-block;" id="gridOuter">
    <div class="grid-container" id="gridContainer"></div>
  </div>
</div>
<div class="swap-banner" id="swapBanner" hidden><span id="swapBannerText">已选择交换来源，请点击另一格的"交换"</span><button id="cancelSwapBtn">取消</button></div>
<div class="mobile-crop-controls" id="mobileCropControls" hidden>
  <div class="mobile-crop-meta"><strong id="mobileCropTitle">调整图片</strong><span id="mobileCropZoom">100%</span></div>
  <input type="range" id="mobileCropRange" min="100" max="600" step="1" value="100" aria-label="图片缩放">
  <button type="button" id="mobileCropReset">重置</button>
  <button type="button" class="mobile-crop-done" id="mobileCropDone">完成</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const ROWS=4,COLS=4,GRID_SIZE=7;
function isMobile(){return ('ontouchstart' in window||navigator.maxTouchPoints>0)&&window.innerWidth<=768}
const state={cells:{},hEdges:{},vEdges:{},hEdgeSizes:{},vEdgeSizes:{},showInfo:false,compactMode:true,cache:{},lastSearch:0,anilistCooldown:0,searchRequestId:0};
let swapFrom=null;
let mobileCropCell=null;

// ═══════════════════════════════════════
//  CELL HTML
// ═══════════════════════════════════════

  if(hasImg){let dw=cs,dh=cs,dl=0,dt=0;if(cd.naturalW&&cd.naturalH&&cd.imgScale>0){dw=cd.naturalW*cd.imgScale;dh=cd.naturalH*cd.imgScale;dl=cd.imgX;dt=cd.imgY}ih=`<img src="${he(src)}" style="width:${dw}px;height:${dh}px;left:${dl}px;top:${dt}px">`}

}

// ═══════════════════════════════════════
//  RENDER GRID

function renderGrid(){

  gridContainer.innerHTML='';gridContainer.className='grid-container'+(state.compactMode?' compact':'');
  const ov=gridOuter.querySelector('.edge-labels-overlay');if(ov)ov.remove();
  if(state.compactMode)renderCompact();else renderNormal();
  updateInfoOverlayVisibility();
}
function renderNormal(){
  gridContainer.style.gridTemplateColumns='var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size)';
  gridContainer.style.gridTemplateRows='var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size) var(--edge-size) var(--cell-size)';
  const f=document.createDocumentFragment();
  for(let gr=0;gr<GRID_SIZE;gr++)for(let gc=0;gc<GRID_SIZE;gc++){
    const e=document.createElement('div');e.dataset.gr=gr;e.dataset.gc=gc;
    if(isCell(gr,gc)){const r=gr/2,c=gc/2;e.className='cell-wrapper';e.innerHTML=cellHTML(r,c,state.cells[`${r}-${c}`])}

}

  const f=document.createDocumentFragment();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const e=document.createElement('div');e.className='cell-wrapper';e.dataset.cr=r;e.dataset.cc=c;e.innerHTML=cellHTML(r,c,state.cells[`${r}-${c}`]);f.appendChild(e)}

  for(let i=0;i<ch.length;i++){const e=ch[i],gr=parseInt(e.dataset.gr),gc=parseInt(e.dataset.gc);if(isCell(gr,gc))attachCellEvents(e,gr/2,gc/2);else if(isHEdge(gr,gc))attachEdgeEvents(e,'h',gr/2,(gc-1)/2);else if(isVEdge(gr,gc))attachEdgeEvents(e,'v',(gr-1)/2,gc/2)}

// ═══════════════════════════════════════
//  COMPACT LABELS (bold + shadow, no bubble)
// ═══════════════════════════════════════

  const cs=getCellSize(),thickness=Math.max(14,Math.min(34,cs*.18)),length=cs*.8,offset=(cs-length)/2;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++){const t=state.hEdges[`${r}-${c}`]||'';ov.appendChild(makeLabel('h',r,c,c*cs+cs-thickness/2,r*cs+offset,thickness,length,t))}

}

const mobileCropControls=document.getElementById('mobileCropControls'),mobileCropRange=document.getElementById('mobileCropRange');
function mobileCropDOM(){if(!mobileCropCell)return null;const{r,c}=mobileCropCell,b=document.querySelector(`.cell-border[data-r="${r}"][data-c="${c}"]`);return{r,c,b,img:b?.querySelector('img'),cd:state.cells[`${r}-${c}`]}}
function updateMobileCropUI(){const ctx=mobileCropDOM();if(!ctx||!ctx.cd?.naturalW||!ctx.cd?.naturalH){if(!ctx)closeMobileCropControls(false);return}const cs=getCellSize(),min=Math.max(cs/ctx.cd.naturalW,cs/ctx.cd.naturalH),zoom=Math.max(100,Math.min(600,Math.round(ctx.cd.imgScale/min*100)));mobileCropRange.value=String(zoom);document.getElementById('mobileCropZoom').textContent=zoom+'%';document.getElementById('mobileCropTitle').textContent=ctx.cd.name||`第 ${ctx.r+1} 行 ${ctx.c+1} 列`;document.querySelectorAll('.mobile-crop-active').forEach(e=>e.classList.remove('mobile-crop-active'));ctx.b?.classList.add('mobile-crop-active')}
function openMobileCropControls(r,c,b){if(!isMobile())return;const changed=!mobileCropCell||mobileCropCell.r!==r||mobileCropCell.c!==c;mobileCropCell={r,c};mobileCropControls.hidden=false;document.body.classList.add('mobile-crop-open');b?.classList.add('mobile-crop-active');updateMobileCropUI();requestAnimationFrame(()=>{if(!b)return;const rect=b.getBoundingClientRect(),limit=window.innerHeight-mobileCropControls.offsetHeight-16;if(rect.bottom>limit||rect.top<8)b.scrollIntoView?.({block:'center',behavior:'smooth'})});if(changed)showToast('已进入图片调整：直接拖动图片，左右滑动底部缩放条',2800)}
function closeMobileCropControls(save=true){if(save&&mobileCropCell)saveState();mobileCropCell=null;mobileCropControls.hidden=true;document.body.classList.remove('mobile-crop-open');document.querySelectorAll('.mobile-crop-active').forEach(e=>e.classList.remove('mobile-crop-active'))}
function setMobileCropZoom(zoom){const ctx=mobileCropDOM();if(!ctx?.b||!ctx.img||!ctx.cd.naturalW||!ctx.cd.naturalH)return;const cs=getCellSize(),min=Math.max(cs/ctx.cd.naturalW,cs/ctx.cd.naturalH),ns=min*Math.max(1,Math.min(6,zoom)),os=ctx.cd.imgScale||min,rect=ctx.b.getBoundingClientRect();zoomCellImg(ctx.b,ctx.img,ctx.cd,cs,ns,os,{clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2});updateMobileCropUI()}
function resetMobileCrop(){const ctx=mobileCropDOM();if(!ctx?.img||!ctx.cd.naturalW||!ctx.cd.naturalH)return;const cs=getCellSize(),cd=ctx.cd;cd.imgScale=Math.max(cs/cd.naturalW,cs/cd.naturalH);cd.imgX=(cs-cd.naturalW*cd.imgScale)/2;cd.imgY=(cs-cd.naturalH*cd.imgScale)/2;cd.cropSize=cs;ctx.img.style.width=cd.naturalW*cd.imgScale+'px';ctx.img.style.height=cd.naturalH*cd.imgScale+'px';ctx.img.style.left=cd.imgX+'px';ctx.img.style.top=cd.imgY+'px';scheduleSave();updateMobileCropUI()}
mobileCropRange.addEventListener('input',()=>setMobileCropZoom(Number(mobileCropRange.value)/100));
document.getElementById('mobileCropReset').onclick=resetMobileCrop;
document.getElementById('mobileCropDone').onclick=()=>{closeMobileCropControls(true);showToast('图片调整已保存')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(mobileCropCell){closeMobileCropControls(true)}else if(modalEl){closeModal()}else if(swapFrom){cancelSwap()}}if((e.ctrlKey||e.metaKey)&&e.key==='e'){e.preventDefault();exportPNG()}});

// ═══════════════════════════════════════
//  KEYBOARD & RESIZE
// ═══════════════════════════════════════
document.getElementById('cancelSwapBtn').onclick=()=>cancelSwap();
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!isMobile())closeMobileCropControls(true);renderGrid();updateMobileCropUI()},180)});

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
loadState();document.getElementById('toggleInfo').checked=state.showInfo;document.getElementById('modeNormal').classList.toggle('active',!state.compactMode);document.getElementById('modeCompact').classList.toggle('active',state.compactMode);renderGrid();localImagesReady=hydrateLocalImages().then(changed=>{if(changed)renderGrid();return changed}).catch(err=>{console.warn('本地图片库初始化失败',err);return false});
console.log('%c角色关系图 4×4','color:#e85d75;font-size:16px');
